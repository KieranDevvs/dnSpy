version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The decompiler (ICSharpCode.Decompiler) and Roslyn. Their versions are properties in DnSpyCommon.props
  # (ILSpyDecompilerVersion, RoslynVersion). Each pull request runs .github/workflows/decompiler-regression.yml:
  # the tests, and the corpus check that lists the types whose decompiled output changed.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "ICSharpCode.Decompiler"
      - dependency-name: "Microsoft.CodeAnalysis*"
    groups:
      # One pull request for all Roslyn packages (they share RoslynVersion)
      roslyn:
        patterns:
          - "Microsoft.CodeAnalysis*"
    open-pull-requests-limit: 5
